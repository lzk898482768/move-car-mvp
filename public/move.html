<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>扫码挪车 · 联系车主</title>
    <link rel="stylesheet" href="./styles.css" />
    <meta name="robots" content="noindex" />
    <script src="./config.js"></script>
  </head>
  <body data-page="move">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="logo">🚗</span>扫码挪车</a>
      <nav>
        <a href="./index.html">生成</a>
        <a href="./privacy.html">隐私</a>
      </nav>
    </header>

    <main class="shell compact">
      <section class="hero-banner fade-in">
        <div class="hb-left">
          <div class="hb-brand">🚗 扫码挪车</div>
          <h1 class="hb-title">欢迎使用<br /><em>挪车码</em></h1>
          <div class="hb-checks">
            <span>匿名通知车主</span>
            <span>保护双方隐私</span>
          </div>
        </div>
        <div class="hb-art">🚙</div>
      </section>

      <div class="ad-slot hidden" data-ad-position="move_top"></div>

      <section class="card plate-check fade-in">
        <div class="check-divider">请核对呼叫车辆车牌号</div>
        <div id="publicVehicle">
          <div class="plate-big">······</div>
          <p class="privacy-note">正在读取二维码信息…</p>
        </div>
        <div id="channelPicker"></div>
        <div class="actions">
          <button class="btn btn-primary cta-lg" id="notifyButton" disabled>
            呼叫车主（加密）
          </button>
          <a class="btn cta-lg hidden" id="directCallButton" href="#" rel="nofollow">
            📞 直接拨打车主
          </a>
        </div>
        <p class="field-hint hidden" id="directCallNote" style="text-align:center;margin-top:-4px">
          平台未开通隐私号，已改为直拨车主真实号码。
        </p>
        <div id="contactResult" class="result hidden" style="margin-top:12px"></div>
      </section>

      <div class="ad-slot hidden" data-ad-position="move_bottom"></div>

      <section class="card">
        <div class="service-grid">
          <a class="service-item" href="./setup.html"><span class="service-ic">📖</span><span>使用说明</span></a>
          <a class="service-item" href="./privacy.html"><span class="service-ic">🔒</span><span>隐私保护</span></a>
          <a class="service-item" href="./demo.html"><span class="service-ic">▶️</span><span>流程演示</span></a>
          <a class="service-item" href="./owner.html"><span class="service-ic">📊</span><span>车主后台</span></a>
        </div>
      </section>

      <footer class="site-footer">
        <span class="fb"><i>🚗</i>扫码挪车</span>
        <p>匿名通知 · 不暴露双方真实号码</p>
      </footer>
    </main>

    <script src="./app.js?v=20260915b" type="module"></script>
  </body>
</html>
